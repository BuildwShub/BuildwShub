<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Recap: invoice match 72 to 94 percent, 1,700 plus customers, zero to one at 95 percent on time, 5.3 percent model improvement."><defs><clipPath id="f"><rect width="1200" height="240" rx="18"/></clipPath></defs><g clip-path="url(#f)"><rect width="1200" height="240" fill="#07070a"/><rect x="16" y="16" width="280" height="208" rx="12" fill="#121218" stroke="#fff" stroke-opacity="0.09"/><text x="38" y="46" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#7d7885" font-weight="700" letter-spacing="3">EPISODE 01</text><text x="38" y="76" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#b8b3bd" >Invoices kept failing to match.</text><text x="38" y="142" font-family="'Bebas Neue', 'Oswald', Impact, 'Arial Narrow', sans-serif" font-size="56" fill="#f3f1ee" >72→94%</text><text x="38" y="166" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#b8b3bd" >invoice-match accuracy</text><text x="38" y="202" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#ff3d5a" font-weight="700" letter-spacing="1.5">THE CALL CENTRE DOCTOR</text><rect x="16" y="220" width="280" height="4" fill="#e5132b" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.04;0.25;1" dur="12s" begin="0s" repeatCount="indefinite"/></rect><rect x="310" y="16" width="280" height="208" rx="12" fill="#121218" stroke="#fff" stroke-opacity="0.09"/><text x="332" y="46" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#7d7885" font-weight="700" letter-spacing="3">EPISODE 02</text><text x="332" y="76" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#b8b3bd" >An AI contact centre needed users.</text><text x="332" y="142" font-family="'Bebas Neue', 'Oswald', Impact, 'Arial Narrow', sans-serif" font-size="56" fill="#f3f1ee" >1,700+</text><text x="332" y="166" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#b8b3bd" >customers in 10 months</text><text x="332" y="202" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#ff3d5a" font-weight="700" letter-spacing="1.5">THE CALL CENTRE DOCTOR</text><rect x="310" y="220" width="280" height="4" fill="#e5132b" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.04;0.25;1" dur="12s" begin="3s" repeatCount="indefinite"/></rect><rect x="604" y="16" width="280" height="208" rx="12" fill="#121218" stroke="#fff" stroke-opacity="0.09"/><text x="626" y="46" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#7d7885" font-weight="700" letter-spacing="3">EPISODE 03</text><text x="626" y="76" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#b8b3bd" >Delivery Tracker did not exist yet.</text><text x="626" y="142" font-family="'Bebas Neue', 'Oswald', Impact, 'Arial Narrow', sans-serif" font-size="56" fill="#f3f1ee" >0 → 1</text><text x="626" y="166" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#b8b3bd" >at 95% on-time delivery</text><text x="626" y="202" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11" fill="#ff3d5a" font-weight="700" letter-spacing="1.5">AECOM · UK EDUCATION</text><rect x="604" y="220" width="280" height="4" fill="#e5132b" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.04;0.25;1" dur="12s" begin="6s" repeatCount="indefinite"/></rect><rect x="898" y="16" width="280" height="208" rx="12" fill="#121218" stroke="#fff" stroke-opacity="0.09"/><text x="920" y="46" font-family="-apple-system, '